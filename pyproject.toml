[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "episode-arm-control"
version = "0.1.0"
description = "Safety-focused TCP/JSON SDK and ROS 2 control stack for the Episode 1 six-axis arm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]
authors = [{ name = "Shikai Lou" }]
keywords = ["robotics", "ros2", "ros2-control", "moveit", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/LJS515/episode-arm-control"
Repository = "https://github.com/LJS515/episode-arm-control"
Issues = "https://github.com/LJS515/episode-arm-control/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
episode-mock-server = "episode_sdk.mock_server:main"

[tool.setuptools]
packages = ["episode_sdk", "episode_hardware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
