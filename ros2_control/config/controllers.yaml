# controller_manager configuration for episode_ros2_control (mock backend tested in Jazzy/WSL2).
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz; the vendor TCP backend is rate-limited internally (see README.md)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    episode_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

episode_arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 5.0
      joint1: {trajectory: 0.3, goal: 0.02}
      joint2: {trajectory: 0.3, goal: 0.02}
      joint3: {trajectory: 0.3, goal: 0.02}
      joint4: {trajectory: 0.3, goal: 0.02}
      joint5: {trajectory: 0.3, goal: 0.02}
      joint6: {trajectory: 0.3, goal: 0.02}
