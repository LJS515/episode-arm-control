# Both execution stacks expose the same action:
#   /episode_arm_controller/follow_joint_trajectory
# - stack ros2_control: joint_trajectory_controller (episode_ros2_control)
# - stack python:       episode_robot_interface (point-to-point waypoints, ignores timing)
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - episode_arm_controller
  episode_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]

trajectory_execution:
  # The python stack executes stop-and-go waypoints and does not honour
  # time_from_start, so execution can take longer than planned.
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 5.0
  allowed_start_tolerance: 0.02
