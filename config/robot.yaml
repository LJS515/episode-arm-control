robot:
  name: episode1
  num_joints: 6
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
  # Posture the official server moves to after homing (C). Maps to URDF zero (D).
  vertical_motor_deg: [180.0, 90.0, 83.0, 30.0, 110.0, 30.0]
  nominal_payload_kg: 0.5        # vendor nominal (B) — not verified
  nominal_reach_mm: 510          # vendor nominal (B) — not verified
  supply: "12V / 10A"            # B
  coarse_reach_bound_mm: 560     # project sanity bound for Cartesian targets (D)

mapping:
  active_profile: ros_model
  profiles:
    vendor_dh:
      evidence: C
      signs: [1, -1, -1, 1, -1, 1]
      offsets_deg: [180.0, 180.0, 83.0, 30.0, 110.0, 30.0]
    ros_model:
      evidence: "B (official robot_interface_node.py: joint = motor - offset; official URDF limits agree)"
      signs: [1, 1, 1, 1, 1, 1]
      offsets_deg: [180.0, 90.0, 83.0, 30.0, 110.0, 30.0]

dh_parameters_mm:   # standard DH, from historical client (C)
  - {d: 166.0, a: 55.0,  alpha_deg: 90.0}
  - {d: 0.0,   a: 200.0, alpha_deg: 0.0}
  - {d: 0.0,   a: 56.0,  alpha_deg: 90.0}
  - {d: 192.0, a: 0.0,   alpha_deg: -90.0}
  - {d: 0.0,   a: 0.0,   alpha_deg: 90.0}
  - {d: 55.0,  a: 0.0,   alpha_deg: 0.0}

controller:
  poll_rate_hz: 20.0       # project default; achievable rate on hardware TBD
  stale_after_s: 0.5
  busy_policy: reject      # reject | queue | preempt
  max_queue: 4
  homing_tolerance_deg: 2.0
  stationary_eps_deg: 0.05
